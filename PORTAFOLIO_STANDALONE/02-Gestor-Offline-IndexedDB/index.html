<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotesDB — Gestor Offline con IndexedDB</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230b1120'%20stroke%3D'%23a855f7'%20stroke-width%3D'4'%2F%3E%3Ctext%20x%3D'50%25'%20y%3D'54%25'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%20font-size%3D'36'%3E%F0%9F%97%84%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div>
                <span class="pill">IndexedDB API · Offline-First CRUD</span>
                <h1>🗄️ NotesDB — Gestor Offline</h1>
                <p>Persistencia local transaccional sin servidor ni dependencias externas.</p>
            </div>
            <button type="button" class="btn primary" id="btnExportJson">📦 Exportar JSON</button>
        </header>

        <section class="form-card">
            <input type="text" id="noteTitle" placeholder="Título de la nota o tarea..." autocomplete="off" />
            <select id="noteCategory">
                <option value="Trabajo">Trabajo</option>
                <option value="Estudio">Estudio</option>
                <option value="Idea">Idea</option>
            </select>
            <button type="button" class="btn primary" id="btnAddNote">➕ Guardar</button>
        </section>

        <section class="search-bar">
            <input type="search" id="searchInput" placeholder="Buscar por título o categoría..." />
            <span id="countLabel">0 registros</span>
        </section>

        <section class="notes-list" id="notesList" aria-live="polite"></section>
    </main>
</body>
</html>
