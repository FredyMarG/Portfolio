<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FileDrop Inspector — Drag &amp; Drop + FileReader</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Crect%20width%3D'64'%20height%3D'64'%20rx%3D'14'%20fill%3D'%230b1120'%20stroke%3D'%2310b981'%20stroke-width%3D'4'%2F%3E%3Ctext%20x%3D'50%25'%20y%3D'54%25'%20dominant-baseline%3D'middle'%20text-anchor%3D'middle'%20font-size%3D'36'%3E%F0%9F%93%82%3C%2Ftext%3E%3C%2Fsvg%3E" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <header class="app-header" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;">
            <div>
                <span class="pill">Drag &amp; Drop API · FileReader · Blob</span>
                <h1>📂 FileDrop Inspector</h1>
                <p>Arrastra o selecciona imágenes, videos, audios o archivos de texto/código para inspeccionar sus metadatos y previsualizarlos al instante.</p>
            </div>
            <button type="button" class="btn" id="btnDemoFile">⚡ Cargar Archivo Demo</button>
        </header>

        <section class="drop-zone" id="dropZone" tabindex="0">
            <div class="drop-icon">⬆️</div>
            <p><strong>Arrastra un archivo aquí</strong> o haz clic para seleccionarlo desde tu equipo</p>
            <input type="file" id="fileInput" hidden />
        </section>

        <section class="progress-wrap" id="progressWrap" hidden>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span id="progressLabel">0%</span>
        </section>

        <section class="meta-bar" id="metaBar" hidden>
            <span id="metaName"></span>
            <span id="metaType"></span>
            <span id="metaSize"></span>
            <button type="button" class="btn" id="btnCopyText" hidden>📋 Copiar contenido</button>
        </section>

        <section class="preview-box" id="previewBox"></section>
    </main>
</body>
</html>
