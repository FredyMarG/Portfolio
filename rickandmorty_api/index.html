<!--
  ============================================================================
  EXPLORADOR MULTIVERSO — THE RICK AND MORTY REST API (rickandmorty_api/index.html)
  ============================================================================
  Propósito: Cliente SPA de consulta asíncrona a la API REST oficial de Rick & Morty
  con filtrado por nombre, estado vital (Alive / Dead / Unknown), paginación
  dinámica y respaldo offline.
-->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <title>Rick &amp; Morty Multiverse API Explorer</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        .rm-hero {
            background: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.22), rgba(11, 15, 25, 0.95) 70%);
            border-bottom: 1px solid rgba(148, 163, 184, 0.16);
            padding: 2.5rem 0 2rem;
        }
        .rm-title {
            background: linear-gradient(90deg, #34d399, #38bdf8, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .rm-search {
            background: #131b2e;
            border: 1px solid rgba(148, 163, 184, 0.25);
            color: #f8fafc;
        }
        .rm-search:focus {
            background: #1a2540;
            color: #ffffff;
            border-color: #34d399;
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
        }
        .rm-search::placeholder {
            color: #94a3b8;
        }
        .status-pill {
            background: #131b2e;
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .status-pill.active, .status-pill:hover {
            background: #10b981;
            color: #06281e;
            border-color: #10b981;
        }
        .rm-card {
            background: #131b2e;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .rm-card:hover {
            transform: translateY(-4px);
            border-color: #34d399;
        }
    </style>
</head>
<body>

    <header class="rm-hero">
        <div class="container text-center">
            <span class="badge bg-success bg-opacity-25 text-success border border-success border-opacity-25 mb-2 px-3 py-2">
                ⚡ REST API Client • Fetch &amp; Async/Await
            </span>
            <h1 class="display-5 rm-title mb-2">The Rick and Morty API Explorer</h1>
            <p class="text-secondary mb-4">Explora personajes del multiverso en tiempo real filtrando por nombre y estado vital.</p>

            <div class="row justify-content-center g-2 mb-3">
                <div class="col-md-6 d-flex gap-2">
                    <input type="text" id="searchInput" class="form-control rm-search rounded-pill px-4" placeholder="🔍 Buscar personaje (ej. Rick, Morty, Beth, Alien)...">
                    <button id="searchBtn" class="btn btn-success fw-bold rounded-pill px-4">Buscar</button>
                </div>
            </div>

            <div class="d-flex justify-content-center flex-wrap gap-2">
                <button class="status-pill active" data-status="">Todos</button>
                <button class="status-pill" data-status="alive">🟢 Vivos (Alive)</button>
                <button class="status-pill" data-status="dead">🔴 Muertos (Dead)</button>
                <button class="status-pill" data-status="unknown">⚪ Desconocido</button>
            </div>
        </div>
    </header>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span id="metaInfo" class="text-secondary small fw-semibold">Consultando API...</span>
            <div class="d-flex gap-2">
                <button id="prevBtn" class="btn btn-sm btn-outline-light rounded-pill px-3" disabled>⬅ Anterior</button>
                <button id="nextBtn" class="btn btn-sm btn-outline-info rounded-pill px-3" disabled>Siguiente ➡</button>
            </div>
        </div>

        <div id="charactersContainer" class="row g-4"></div>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
