<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Icons"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Dashboard &amp; Lista de Tareas — BIT</title>
  </head>
  <body>
    <header class="top-header d-flex align-items-center justify-content-end">
      <nav class="navbar navbar-expand-lg top-navbar w-100 px-3">
        <div class="container-fluid d-flex align-items-center justify-content-between gap-3">
          <form class="d-flex c-form-nav flex-grow-1" role="search" style="max-width: 420px" onsubmit="return false;">
            <input
              class="form-control c-form-nav-input text-white"
              type="search"
              placeholder="Buscar tareas o módulos..."
              aria-label="Search"
            />
            <i class="bi bi-search c-form-nav-icon text-light"></i>
          </form>

          <div class="input-group" style="max-width: 13rem">
            <label class="input-group-text" for="inputGroupSelect01">Cambiar a</label>
            <select class="form-select" id="inputGroupSelect01">
              <option selected>Bit</option>
              <option value="1">Bit 2</option>
              <option value="2">Bit 3</option>
            </select>
          </div>

          <span
            class="navbar-text d-flex align-items-center justify-content-between gap-3"
            style="color: white"
          >
            <button
              type="button"
              class="btn fw-semibold"
              style="
                border-radius: 0.4rem;
                padding: 0.45rem 1.25rem;
                background-color: #00d2e5;
                color: #1b222c;
              "
              onclick="document.querySelector('.todo-input').focus()"
            >
              Crear +
            </button>
            <i class="bi bi-bell fs-5" style="cursor: pointer"></i>
            <button
              type="button"
              class="btn d-flex align-items-center justify-content-center p-0"
              style="
                background-color: #00d2e5;
                border-radius: 50%;
                width: 44px;
                height: 44px;
              "
            >
              <img
                src="./assets/img/avatar.png"
                alt="Avatar"
                width="36"
                height="36"
                class="rounded-circle"
              />
            </button>
          </span>
        </div>
      </nav>
    </header>

    <nav class="sidebar-nav position-fixed top-0 bottom-0 start-0 overflow-hidden text-white">
      <ul class="px-0 mb-0">
        <li class="list-unstyled">
          <div class="logo text-center d-flex align-items-center mt-3">
            <img
              src="assets/img/Instituto-Cursos-Programacion-50lg.png"
              class="rounded-circle"
              alt="Logo BIT"
            />
            <span class="fw-bold text-uppercase fs-4 mx-4 text-info">BIT</span>
          </div>
        </li>
        <li class="list-unstyled mt-2">
          <a href="#" class="fs-6 d-table text-decoration-none position-relative">
            <span class="material-icons-outlined position-relative text-center">home</span>
            <span class="nav-item position-relative ms-4">Inicio</span>
          </a>
        </li>
        <li class="list-unstyled">
          <a href="#" class="fs-6 text-decoration-none position-relative d-table">
            <span class="material-icons-outlined position-relative text-center">notifications</span>
            <span class="nav-item position-relative ms-4">Notificaciones</span>
          </a>
        </li>
        <li class="list-unstyled">
          <a href="#" class="fs-6 text-decoration-none position-relative d-table">
            <span class="material-icons-outlined position-relative text-center">textsms</span>
            <span class="nav-item position-relative ms-4">Mensajes</span>
          </a>
        </li>
        <li class="list-unstyled">
          <a href="#" class="fs-6 text-decoration-none position-relative d-table">
            <span class="material-icons-outlined position-relative text-center">signal_cellular_alt</span>
            <span class="nav-item position-relative ms-4">Estadísticas</span>
          </a>
        </li>
        <li class="list-unstyled">
          <a href="#" class="fs-6 text-decoration-none position-relative d-table">
            <span class="material-icons-outlined position-relative text-center">schedule</span>
            <span class="nav-item position-relative ms-4">Historial</span>
          </a>
        </li>
        <li class="list-unstyled">
          <a href="#" class="fs-6 text-decoration-none position-relative d-table">
            <span class="material-icons-outlined position-relative text-center">restore</span>
            <span class="nav-item position-relative ms-4">Restaurar</span>
          </a>
        </li>
        <li class="list-unstyled">
          <a href="#" class="fs-6 text-decoration-none position-relative d-table">
            <span class="material-icons-outlined position-relative text-center">delete</span>
            <span class="nav-item position-relative ms-4">Papelera</span>
          </a>
        </li>
        <li class="list-unstyled">
          <a href="#" class="logout position-absolute text-decoration-none d-table">
            <span class="material-icons-outlined position-relative text-center">logout</span>
            <span class="nav-item position-relative ms-4">Salir</span>
          </a>
        </li>
      </ul>
    </nav>

    <main class="main-workspace">
      <div class="container todo-card my-5 p-4 ms-auto me-auto bg-white rounded-3 shadow">
        <h1 class="text-center fs-2 fw-bold mb-3">Lista de Tareas</h1>
        <div class="w-100 ms-auto me-auto mt-3">
          <form class="d-flex">
            <input type="text" class="todo-input" placeholder="Agregar tarea..." />
            <button class="btn-add text-white border-0">+</button>
          </form>
          <div class="alert alert-danger mt-2 vacio" role="alert">
            Ingrese una tarea
          </div>
        </div>
        <div class="li-container bg-white w-100 mt-3">
          <ul class="ul-todo p-0"></ul>
        </div>
        <div class="empty text-center mt-3">
          <p>No tienes tareas pendientes.</p>
        </div>
      </div>
    </main>

    <script src="js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
