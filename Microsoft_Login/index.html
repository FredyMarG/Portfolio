<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Sign in to your account — Microsoft</title>
</head>
<body class="ms-body d-flex flex-column justify-content-center align-items-center">

    <main class="ms-container">
        <div class="ms-card bg-white shadow-sm">
            <div class="mb-3">
                <img src="assets/img/img1.png" alt="Microsoft" class="ms-logo">
            </div>

            <form id="msLoginForm" onsubmit="return false;">
                <label for="user" class="w-100 fw-semibold fs-4 mb-2 text-dark">Sign in</label>
                <input type="text" id="user" name="user" class="ms-input w-100" placeholder="Email, phone, or Skype" required>
                <p id="msStatusMsg" class="small mt-2 mb-0 d-none"></p>

                <div class="ms-links mt-3">
                    <p class="mb-2">No account? <a href="#">Create one!</a></p>
                    <p class="mb-0"><a href="#">Can’t access your account?</a></p>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="button" class="btn ms-btn-secondary px-4" onclick="document.getElementById('user').value=''; document.getElementById('msStatusMsg').classList.add('d-none');">Back</button>
                    <button type="submit" class="btn ms-btn-primary px-4">Next</button>
                </div>
            </form>
        </div>

        <button type="button" class="ms-options-card bg-white shadow-sm d-flex w-100 align-items-center border-0 mt-3">
            <span class="material-symbols-outlined me-3 ms-key-icon">key</span>
            <span>Sign-in options</span>
        </button>
    </main>

    <script src="assets/js/bootstrap.min.js"></script>
    <script>
        const msForm = document.getElementById('msLoginForm');
        const msMsg = document.getElementById('msStatusMsg');
        if (msForm) {
            msForm.addEventListener('submit', () => {
                const val = document.getElementById('user').value.trim();
                msMsg.classList.remove('d-none', 'text-danger', 'text-success');
                if (val) {
                    msMsg.classList.add('text-success');
                    msMsg.textContent = '✓ Account recognized: ' + val + '. Proceeding to password verification...';
                }
            });
        }
    </script>
</body>
</html>
